<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ff3b30"/>
      <stop offset="0.25" stop-color="#ffcc00"/>
      <stop offset="0.5"  stop-color="#34c759"/>
      <stop offset="0.75" stop-color="#32ade6"/>
      <stop offset="1"    stop-color="#af52de"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a52"/>
      <stop offset="1" stop-color="#26262c"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- light spill under the keyboard -->
  <rect x="14" y="52" width="100" height="52" rx="14" fill="url(#glow)" filter="url(#soft)" opacity="0.85"/>

  <!-- keyboard body -->
  <rect x="12" y="44" width="104" height="56" rx="10" fill="url(#body)"/>
  <rect x="12.5" y="44.5" width="103" height="55" rx="9.5" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>

  <!-- key rows, lit along the spectrum -->
  <g fill="url(#glow)">
    <rect x="22" y="54" width="13" height="10" rx="2.5"/>
    <rect x="39" y="54" width="13" height="10" rx="2.5"/>
    <rect x="56" y="54" width="13" height="10" rx="2.5"/>
    <rect x="73" y="54" width="13" height="10" rx="2.5"/>
    <rect x="90" y="54" width="16" height="10" rx="2.5"/>

    <rect x="22" y="68" width="16" height="10" rx="2.5"/>
    <rect x="42" y="68" width="13" height="10" rx="2.5"/>
    <rect x="59" y="68" width="13" height="10" rx="2.5"/>
    <rect x="76" y="68" width="13" height="10" rx="2.5"/>
    <rect x="93" y="68" width="13" height="10" rx="2.5"/>

    <rect x="22" y="82" width="13" height="10" rx="2.5"/>
    <rect x="39" y="82" width="50" height="10" rx="2.5"/>
    <rect x="93" y="82" width="13" height="10" rx="2.5"/>
  </g>

  <!-- light rays above, the universal backlight cue -->
  <g stroke="url(#glow)" stroke-width="5" stroke-linecap="round" opacity="0.95">
    <path d="M46 30 L40 18"/>
    <path d="M64 26 L64 12"/>
    <path d="M82 30 L88 18"/>
  </g>
</svg>
